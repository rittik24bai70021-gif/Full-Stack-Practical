name: Build Observatory CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React dashboard
        working-directory: frontend
        run: npm ci && npm run build
      - name: Check Docker
        run: docker info
      - name: Verify all four layers
        run: bash mvnw --batch-mode --no-transfer-progress clean verify -Pfull
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-contracts
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/pacts/
      - name: Preserve executable application
        uses: actions/upload-artifact@v4
        with:
          name: build-observatory-jar
          path: target/*.jar
