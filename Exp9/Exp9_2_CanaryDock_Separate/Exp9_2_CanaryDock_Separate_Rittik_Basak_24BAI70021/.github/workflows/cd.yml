name: CanaryDock Continuous Deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canarydock-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
        working-directory: frontend
      - name: Check deployment scripts
        run: |
          bash -n deploy/release.sh
          python3 -m unittest discover -s deploy/tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/target/surefire-reports/
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_CD == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/canarydock:${{ github.sha }}
      - id: image
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=$USERNAME/canarydock@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    needs: publish
    # Label a dedicated Linux runner "canarydock"; bootstrap it before enabling CD.
    runs-on: [self-hosted, linux, x64, canarydock]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Registry login
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login -u "$USERNAME" --password-stdin
      - name: Canary rollout with health gates and automatic rollback
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: bash deploy/release.sh deploy "$IMAGE"
      - name: Collect gate evidence
        if: always()
        run: |
          mkdir -p evidence
          cp -r "$HOME/.canarydock-exp92/evidence/." evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: evidence/
      - name: Registry logout
        if: always()
        run: docker logout
