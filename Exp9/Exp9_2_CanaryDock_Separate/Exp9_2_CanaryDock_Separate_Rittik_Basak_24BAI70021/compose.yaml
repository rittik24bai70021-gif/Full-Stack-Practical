services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_VERSION: docker-local-1.0
      APP_SLOT: local
      DEMO_ENABLED: "true"
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_TARGET: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
